<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2233">
<title>Nutri-Mark Scan</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ground:#F5F5F3; --surface:#FFFFFF; --ink:#3A3F57; --muted:#6E7389; --hair:#D9DBE3; --accent:#161CB7;
    --cam:#14161F; --A:#00833E; --B:#6DBE4B; --C:#FFCE02; --D:#F78D2B; --E:#F15E3E;
    --shadow:0 18px 50px rgba(58,63,87,.18); --page:#E9EAEE;
    --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  }
  .phone[data-look="verdict"]{--ground:#1F2233;--surface:#2A2E42;--ink:#F5F5F3;--muted:#A0A6BE;--hair:#3A3F57;--accent:#8A90F5;--shadow:0 18px 50px rgba(0,0,0,.45)}
  .phone[data-look="scanner"]{--ground:#0E1016;--surface:#1E2130;--ink:#F5F5F3;--muted:#A0A6BE;--hair:#3A3F57;--accent:#8A90F5;--shadow:0 18px 50px rgba(0,0,0,.5)}
  html,body{height:100%}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  .bar{width:100%;max-width:390px;display:none;justify-content:flex-end;align-items:center;font-size:13px;color:#5A5F76}
  body.dev .bar{display:flex}
  .bar .grp{display:flex;gap:2px;border:1px solid #C9CBD5;border-radius:8px;padding:2px;background:#fff}
  .bar button{font:inherit;font-size:13px;border:0;background:transparent;color:#5A5F76;padding:5px 10px;border-radius:6px;cursor:pointer}
  .bar button[aria-pressed="true"]{background:#3A3F57;color:#fff}
  .phone{width:390px;max-width:100%;height:780px;max-height:calc(100vh - 32px);background:var(--ground);color:var(--ink);border-radius:38px;box-shadow:var(--shadow);overflow:hidden;position:relative;transition:background .35s ease,color .35s ease}
  body.dev .phone{max-height:calc(100vh - 80px)}
  @media (max-width:480px){body{padding:8px}.phone{height:calc(100vh - 16px);height:calc(100dvh - 16px);max-height:none;border-radius:24px} body.dev .phone{height:calc(100dvh - 60px)}}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .45s ease,transform .45s ease}
  .screen[hidden]{display:none}
  .screen.leaving{opacity:0;transform:translateY(-24px);pointer-events:none}
  .screen.entering{opacity:0;transform:translateY(24px)}
  /* header with language toggle inside the frame */
  .head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px}
  .brand{font-weight:600;font-size:15px}
  .lang{display:flex;gap:2px;border:1px solid var(--hair);border-radius:8px;padding:2px}
  .lang button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--muted);padding:3px 8px;border-radius:6px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
  /* intro */
  .intro{padding:36px 22px 26px;justify-content:flex-start;align-items:stretch;gap:10px}
  .intro-mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
  .stage{flex:0 0 auto;height:260px;display:grid;align-items:end;justify-items:center;padding-bottom:6px;position:relative}
  .cycle{position:absolute;inset:0;display:grid;place-items:center;font-size:220px;font-weight:700;line-height:1;letter-spacing:-.05em;opacity:0;transform:scale(.3)}
  .cycle.pop{animation:pop .26s cubic-bezier(.2,.9,.3,1.2) forwards}
  @keyframes pop{0%{transform:scale(.55);opacity:.15}100%{transform:scale(1);opacity:1}}
  .cycle.out{animation:cycleOut .45s ease forwards}
  @keyframes cycleOut{0%{transform:scale(1);opacity:1}100%{transform:scale(.12);opacity:0}}
  .miniband{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,300px);opacity:0}
  .miniband.in{opacity:1}
  .miniband b{height:54px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:21px;color:#fff;transform:scale(0)}
  .miniband.in b{animation:cell .42s cubic-bezier(.2,.9,.3,1.25) forwards;animation-delay:calc(var(--i)*80ms)}
  @keyframes cell{to{transform:scale(1)}}
  .miniband b[data-g="A"]{background:var(--A)} .miniband b[data-g="B"]{background:var(--B)} .miniband b[data-g="C"]{background:var(--C);color:#3A2A00} .miniband b[data-g="D"]{background:var(--D)} .miniband b[data-g="E"]{background:var(--E)}
  .bandends{direction:ltr;display:flex;justify-content:space-between;width:min(100%,300px);margin:6px auto 0;font-size:11px;color:var(--muted);opacity:0;transition:opacity .5s}
  .bandends.in{opacity:1}
  .intro-copy{text-align:center;opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
  .intro-copy.in{opacity:1;transform:none}
  .intro-copy h1{font-size:30px;margin:0 0 6px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  .intro-copy p{margin:0 auto;max-width:32ch;color:var(--muted);font-size:15px;line-height:1.5;text-wrap:balance}
  .intro-actions{margin-top:auto;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
  .intro-actions.in{opacity:1;transform:none}
  .langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .langs button{font:inherit;font-size:15px;padding:12px;border-radius:12px;border:1px solid var(--hair);background:transparent;color:var(--ink);cursor:pointer}
  .langs button[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .go,.primary{font:inherit;font-size:16px;font-weight:600;padding:16px;border-radius:14px;border:0;background:var(--ink);color:var(--ground);cursor:pointer}
  .secondary{font:inherit;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--hair);background:transparent;color:var(--ink);cursor:pointer}
  .linkbtn{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
  /* guidance card */
  .guide{padding:18px 22px 22px;gap:14px;justify-content:flex-start}
  .guide h2{margin:0;font-size:20px;font-weight:600;text-wrap:balance}
  .guide .art{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .guide svg{width:100%;height:auto;max-height:230px;display:block}
  .guide ol{margin:0;padding-inline-start:20px;font-size:15px;line-height:1.6;color:var(--ink)}
  .guide .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  /* scan */
  .cam{flex:1;margin:0 14px;border-radius:26px;background:var(--cam);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .cam::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
  .sweep{position:absolute;left:26px;right:26px;top:34px;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px 4px rgba(255,255,255,.55);opacity:0;pointer-events:none;z-index:1}
  .scanning .sweep{animation:sweep 1.4s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes sweep{0%{opacity:0;transform:translateY(0)}8%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateY(560px)}}
  .preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
  .preview.show{opacity:1}
  .placeholder{color:#B6BACB;font-size:15px;text-align:center;padding:0 36px;line-height:1.6;z-index:1;max-width:32ch}
  .camfoot{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.6));z-index:2}
  .hint{font-size:13.5px;opacity:.95;text-align:center;min-height:1.4em;line-height:1.4}
  .shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
  .shutter span{width:54px;height:54px;border-radius:50%;background:#fff;transition:transform .15s ease,background .2s}
  .shutter:active span{transform:scale(.88)}
  .gallery{font:inherit;font-size:12.5px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 12px;cursor:pointer}
  .scanning .shutter,.scanning .gallery{pointer-events:none}
  .scanning .gallery{opacity:.5}
  .scanning .shutter span{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(.82)}}
  .cam.hasmsg .placeholder{visibility:hidden}
  .msg{position:absolute;left:22px;right:22px;top:42%;transform:translateY(-50%);background:#14161F;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:16px 18px;font-size:14.5px;line-height:1.55;text-align:center;z-index:3;display:none}
  .msg.show{display:block}
  .msg .btns{display:flex;flex-direction:column;gap:6px;margin-top:12px;align-items:center}
  .msg button.primary{font-size:14px;padding:10px 16px;border-radius:10px;background:#fff;color:#14161F;width:auto}
  .msg .linkbtn{color:#C9CCE0}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px}
  /* confirm card */
  .confirm{padding:0 22px 18px;overflow:auto;scrollbar-width:none}
  .confirm::-webkit-scrollbar{display:none}
  .confirm h2{margin:6px 0 4px;font-size:19px;font-weight:600}
  .confirm .sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
  .kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:15px;border-top:1px solid var(--hair);padding-top:10px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
  .kv input{font:inherit;font-size:15px;width:6.5em;text-align:end;padding:6px 8px;border:1px solid var(--hair);border-radius:8px;background:var(--surface);color:var(--ink)}
  .kv select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--hair);border-radius:8px;background:var(--surface);color:var(--ink)}
  .flags{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
  .confirm .actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  /* result */
  .result{padding:0 22px 18px;overflow:auto;scrollbar-width:none}
  .result::-webkit-scrollbar{display:none}
  .product{display:flex;align-items:center;gap:14px;margin:2px 0 12px}
  .thumb{width:64px;height:64px;border-radius:14px;flex:none;object-fit:cover;background:var(--hair)}
  .product h2{margin:0;font-size:19px;font-weight:600;line-height:1.25;text-wrap:balance}
  .product p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .band{direction:ltr;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:0 0 4px}
  .band b{height:44px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;background:var(--hair);opacity:.38;transform:scale(.94);transition:background .35s ease,opacity .35s ease,transform .35s ease,box-shadow .35s}
  .band b.on{opacity:1;transform:scale(1)}
  .band b[data-g="A"].on{background:var(--A)} .band b[data-g="B"].on{background:var(--B)} .band b[data-g="C"].on{background:var(--C);color:#3A2A00} .band b[data-g="D"].on{background:var(--D)} .band b[data-g="E"].on{background:var(--E)}
  .band b.hit{transform:scale(1.14);box-shadow:0 8px 22px rgba(0,0,0,.28);z-index:1}
  .band b.dim{opacity:.32;transform:scale(.92)}
  .bandends.result-ends{width:100%;margin:0 0 4px}
  .verdict{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0;min-height:120px}
  .letter{font-size:140px;line-height:.9;font-weight:700;letter-spacing:-.04em;transform:scale(.4);opacity:0;transform-origin:center;display:block}
  .letter.land{animation:land .55s cubic-bezier(.2,.9,.3,1.25) forwards}
  @keyframes land{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
  .letter.swap{animation:swap .42s ease forwards}
  @keyframes swap{0%{transform:scale(1);opacity:1}40%{transform:scale(.78);opacity:.2}100%{transform:scale(1);opacity:1}}
  .meaning{flex:1;font-size:16px;font-weight:500;line-height:1.35;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
  .meaning.in{opacity:1;transform:none}
  .meaning small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:4px}
  .reasons{display:flex;flex-direction:column;gap:6px;margin:2px 0 10px;padding:0;list-style:none}
  .reasons li{display:flex;align-items:center;gap:10px;font-size:14.5px;opacity:0;transform:translateX(var(--slide,-14px));transition:opacity .35s,transform .35s}
  [dir="rtl"] .reasons li{--slide:14px}
  .reasons li.in{opacity:1;transform:none}
  .reasons li i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--gcol,var(--D))}
  .reasons li.pos i{background:var(--A)}
  .values{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:10px 0;margin:0 0 10px;opacity:0;transition:opacity .45s}
  .values.in{opacity:1}
  .values div{display:flex;flex-direction:column;gap:2px}
  .values dt{font-size:11px;color:var(--muted)} .values dd{margin:0;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .values dd small{font-size:11.5px;font-weight:400;color:var(--muted);margin-inline-start:6px}
  .phone[data-look="scanner"] .whatif{background:rgba(255,255,255,.06)}
  .values dd .kj{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
  .per{font-size:11.5px;color:var(--muted);margin:-6px 0 4px;line-height:1.45}
  .flagsline{font-size:11.5px;color:var(--muted);margin:0 0 10px;line-height:1.45}
  .whatif{opacity:0;transform:translateY(10px);transition:opacity .45s,transform .45s;background:var(--surface);border-radius:16px;padding:12px 14px 10px;margin:0 0 10px;box-shadow:0 1px 0 var(--hair)}
  .whatif.in{opacity:1;transform:none}
  .whatif h4{margin:0 0 8px;font-size:14px;font-weight:600}
  .whatif .row{display:flex;align-items:center;gap:12px}
  .whatif input[type=range]{flex:1;accent-color:var(--accent);height:28px;margin:0}
  .whatif output{font-variant-numeric:tabular-nums;font-size:13px;min-width:6.5em;text-align:end;color:var(--muted)}
  .whatif .becomes{margin-top:6px;font-size:13.5px;min-height:1.3em}
  .whatif .becomes b{font-size:16px;padding:0 6px;border-radius:6px;color:#fff;background:var(--gcol,var(--D))}
  .whatif .becomes b.C{color:#3A2A00}
  .whatif .note{font-size:11px;color:var(--muted);margin-top:6px}
  .foot{font-size:11px;color:var(--muted);line-height:1.45;margin:0 0 10px;opacity:0;transition:opacity .45s}
  .foot.in{opacity:1}
  .again{width:100%;font:inherit;font-size:15px;font-weight:600;padding:14px;border-radius:14px;border:0;background:var(--ink);color:var(--ground);cursor:pointer;opacity:0;transition:opacity .45s}
  .again.in{opacity:1}
  /* scanner look */
  .phone[data-look="scanner"] #scan .head{position:absolute;top:0;left:0;right:0;z-index:2;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
  .phone[data-look="scanner"] #scan .lang{border-color:rgba(255,255,255,.4)} .phone[data-look="scanner"] #scan .lang button{color:#fff}
  .phone[data-look="scanner"] .cam{position:absolute;inset:0;margin:0;border-radius:0}
  .phone[data-look="scanner"] .sweep{top:84px}
  .phone[data-look="scanner"] #result{top:auto;bottom:0;height:76%;border-radius:26px 26px 0 0;background:var(--surface);box-shadow:0 -14px 40px rgba(0,0,0,.5);z-index:3;padding-top:6px}
  .phone[data-look="scanner"] #result::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--hair);margin:4px auto 12px}
  .phone[data-look="scanner"] #result .head,.phone[data-look="scanner"] #result .product{display:none}
  .phone[data-look="scanner"] .verdict{min-height:96px;margin:4px 0 0}
  .phone[data-look="scanner"] .letter{font-size:96px}
  .badge{position:absolute;top:96px;right:30px;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:36px;color:#fff;background:var(--gcol,#F78D2B);box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 4px rgba(255,255,255,.92);transform:scale(0);opacity:0;z-index:2}
  .badge.in{animation:land .55s cubic-bezier(.2,.9,.3,1.25) forwards}
  .badge.C{color:#3A2A00}
</style>
</head>
<body>

<div class="bar" id="bar">
  <div class="grp" role="group" aria-label="Look">
    <button id="look-verdict" aria-pressed="true">Verdict</button>
    <button id="look-label" aria-pressed="false">Label</button>
    <button id="look-scanner" aria-pressed="false">Scanner</button>
  </div>
</div>

<div class="phone" id="phone" data-look="verdict" dir="rtl" lang="ar">

  <section class="screen intro" id="intro">
    <div class="intro-mid">
    <div class="stage">
      <div class="cycle" id="cycle" aria-hidden="true">A</div>
      <div>
        <div class="miniband" id="miniband" dir="ltr" aria-label="Nutri-Mark A to E">
          <b data-g="A" style="--i:0">A</b><b data-g="B" style="--i:1">B</b><b data-g="C" style="--i:2">C</b><b data-g="D" style="--i:3">D</b><b data-g="E" style="--i:4">E</b>
        </div>
        <div class="bandends" id="bandends"><span data-t="bandBest"></span><span data-t="bandWorst"></span></div>
      </div>
    </div>
    <div class="intro-copy" id="introCopy"><h1 data-t="introTitle"></h1><p data-t="introLine"></p></div>
    </div>
    <div class="intro-actions" id="introActions">
      <div class="langs" role="group" aria-label="Language"><button id="ilang-ar" aria-pressed="true">عربي</button><button id="ilang-en" aria-pressed="false">English</button></div>
      <button class="go" id="go" data-t="introGo"></button>
    </div>
  </section>

  <section class="screen guide" id="guide" hidden>
    <div class="head" style="padding-inline:0"><div class="brand" data-t="title"></div><div class="lang"><button class="lang-ar">عربي</button><button class="lang-en">EN</button></div></div>
    <h2 data-t="guideTitle"></h2>
    <div class="art">
    <svg viewBox="0 0 360 200" aria-hidden="true">
      <g transform="translate(20,20)">
        <rect x="0" y="0" width="140" height="160" rx="10" fill="#E9C46A" stroke="#3A3F57" stroke-width="3"/>
        <rect x="18" y="30" width="104" height="26" rx="6" fill="#B8862B" opacity=".8"/>
        <circle cx="70" cy="105" r="30" fill="#F3EFE5" opacity=".9"/>
        <text x="70" y="18" font-size="11" text-anchor="middle" fill="#3A3F57" font-weight="700">FRONT</text>
        <circle cx="120" cy="18" r="16" fill="#F15E3E"/><path d="M112 10 l16 16 M128 10 l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      </g>
      <g transform="translate(200,20)">
        <rect x="0" y="0" width="140" height="160" rx="10" fill="#F3EFE5" stroke="#3A3F57" stroke-width="3"/>
        <rect x="14" y="26" width="112" height="118" rx="4" fill="none" stroke="#00833E" stroke-width="4"/>
        <g stroke="#3A3F57" stroke-width="2.5" stroke-linecap="round">
          <line x1="24" y1="44" x2="72" y2="44"/><line x1="96" y1="44" x2="116" y2="44"/>
          <line x1="24" y1="62" x2="66" y2="62"/><line x1="98" y1="62" x2="116" y2="62"/>
          <line x1="24" y1="80" x2="78" y2="80"/><line x1="94" y1="80" x2="116" y2="80"/>
          <line x1="24" y1="98" x2="62" y2="98"/><line x1="100" y1="98" x2="116" y2="98"/>
          <line x1="24" y1="116" x2="70" y2="116"/><line x1="96" y1="116" x2="116" y2="116"/>
          <line x1="24" y1="134" x2="58" y2="134"/><line x1="102" y1="134" x2="116" y2="134"/>
        </g>
        <text x="70" y="18" font-size="11" text-anchor="middle" fill="#3A3F57" font-weight="700">BACK</text>
        <circle cx="120" cy="18" r="16" fill="#00833E"/><path d="M111 18 l6 6 l12 -13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
    <ol><li data-t="guide1"></li><li data-t="guide2"></li><li data-t="guide3"></li></ol>
    </div>
    <div class="actions">
      <button class="primary" id="guideOpen" data-t="guideOpen"></button>

    const act=data.decision && data.decision.action, rs=(data.decision&&data.decision.reasons)||[];
    if(act==="not_food"){ busy=false; hint.textContent=s.hint; showMsg(s.notFood, s.retakeOtherSide, "guide"); return; }
    if(act==="incomplete_label"){ busy=false; hint.textContent=s.hint; const names=(data.decision.missing||[]).map(k=>s.missingNames[k]||k); showMsg(s.incomplete(names.join(lang==="ar"?"، ":", ")), s.retake, "camera"); return; }
    if(act!=="grade" || !data.grade || !data.grade.ok){
      busy=false; hint.textContent=s.hint;
      if(rs.includes("no_table_in_photo")) showMsg(s.noTable, s.retakeOtherSide, "guide");
      else if(rs.includes("reader_declined")) showMsg(s.declinedMsg, s.retake, "camera");
      else showMsg(s.retakeMsg, s.retake, "camera"); return;
    }
    current=data; busy=false; editing=false;
    if(rs.includes("plain_water")) showResult(); else { renderConfirm(); swapTo(scan, confirm); }
  }

  // ---------- confirm and correct ----------
  function kcalOf(v){ return isNum(v.energy_kcal)?v.energy_kcal:(isNum(v.energy_kJ)?Math.round(v.energy_kJ/4.184):null); }
  function saltOf(v){ return isNum(v.salt_g)?v.salt_g:(isNum(v.sodium_mg)?round1(v.sodium_mg/1000*2.5):null); }
  function renderConfirm(){
    const s=S[lang], d=current, rd=d.reading, v=d.per100||{};
    const unit=(rd.basis==="per_100ml"||rd.category==="beverages")?"ml":"g";
    const G=lang==="ar"?"غ":"g";
    const rows=[["product",rd.product_name||s.cat[rd.category]||"–",null],["category",s.cat[rd.category]||rd.category,"category"],["energy",kcalOf(v),"energy",{unit:"kcal",ltr:true}],["sugar_g",v.sugar_g,"sugar_g",{unit:G}],["satfat_g",v.satfat_g,"satfat_g",{unit:G}],["salt",saltOf(v),"salt",{unit:G}],["basis",s.basisNames[rd.basis==="per_serving"?(unit==="ml"?"per_100ml":"per_100g"):rd.basis]||"–",null]];
    $("kv").innerHTML = rows.map(([k,val,field,o])=>{
      let cell;
      const wrap = x => (o&&o.ltr) ? `<span dir="ltr">${x}</span>` : x;   // "335 kcal" must not render as "kcal 335" in Arabic
      if(editing && field==="category") cell=`<select id="ed-category">${Object.keys(s.cat).map(c=>`<option value="${c}" ${c===rd.category?"selected":""}>${s.cat[c]}</option>`).join("")}</select>`;
      else if(editing && field && o) cell=wrap(`<input id="ed-${field}" type="number" inputmode="decimal" step="0.1" min="0" value="${isNum(val)?val:""}"> ${o.unit}`);
      else cell = isNum(val)? wrap(`${val} ${o?o.unit:""}`) : (val||"–");
      return `<dt>${s.kv[k]}</dt><dd>${cell}</dd>`; }).join("");
    $("confirmGo").style.display = editing ? "none" : "";
    const flags=(d.flags||[]).map(f=>s.flagNames[f]).filter(Boolean);
    $("confirmFlags").textContent = flags.length ? s.flagsLine(flags.join(lang==="ar"?" و":" and ")) : "";
    $("confirmEdit").textContent = editing ? s.confirmSave : s.confirmEdit;
  }
  $("confirmGo").addEventListener("click", ()=>{ swapTo(confirm, result, true); showResult(true); });
  $("confirmEdit").addEventListener("click", async ()=>{
    if(!editing){ editing=true; renderConfirm(); return; }
    const num=id=>{ const el=$(id); if(!el||el.value==="") return null; const n=parseFloat(el.value); return Number.isFinite(n)?n:null; };
    const rd=current.reading, v=current.per100||{};
    const values={ sugar_g:num("ed-sugar_g"), satfat_g:num("ed-satfat_g"), salt_g:num("ed-salt") };
    const kcal=num("ed-energy"); if(isNum(kcal)){ values.energy_kcal=kcal; values.energy_kJ=Math.round(kcal*4.2); }
    const category=$("ed-category")?$("ed-category").value:rd.category;
    const base={...rd, basis: rd.basis==="per_serving"?((rd.category==="beverages"||rd.basis==="per_100ml")?"per_100ml":"per_100g"):rd.basis, serving_size:null, values:{...v, sodium_mg:null}};
    $("confirmEdit").disabled=true;
    try{
      const r=await fetch(BACKEND+"/correct",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({scan_id:current.scan_id,device_id:deviceId,reading:base,category,values:Object.fromEntries(Object.entries(values).filter(([,x])=>isNum(x)))})});
      const data=await r.json();
      if(r.ok && data.grade && data.grade.ok){ current={...current, reading:data.reading, per100:data.per100, grade:data.grade, reasons:data.reasons, flags:data.flags, engine_input:engineInputFrom(data)}; editing=false; }
    }catch(err){ console.warn("correct failed",err); }
    $("confirmEdit").disabled=false; renderConfirm();
  });
  function engineInputFrom(data){ // the backend returns the engine input for scans; for corrections rebuild it from per100
    const v=data.per100||{}, rd=data.reading;
    return { category: rd.category, energy_kJ:v.energy_kJ, energy_kcal:v.energy_kcal, fat_g:v.fat_g, satfat_g:v.satfat_g, sugar_g:v.sugar_g, salt_g:v.salt_g, sodium_mg:v.sodium_mg, fibre_g:isNum(v.fibre_g)?v.fibre_g:0, protein_g:isNum(v.protein_g)?v.protein_g:0, fvl_pct:isNum(rd.fvl_pct_estimate)?rd.fvl_pct_estimate:0, sweeteners:!!rd.sweeteners_present, water:!!rd.plain_water };
  }

  // ---------- result ----------
  function renderResultText(){
    const s=S[lang], d=current, rd=d.reading, g=d.grade, v=d.per100||{};
    const isWater=(d.decision&&d.decision.reasons||[]).includes("plain_water");
    $("pname").textContent = rd.product_name || s.cat[rd.category] || "";
    $("pmeta").textContent = [rd.brand, s.cat[rd.category]].filter(Boolean).join(" · ");
    const unit=(rd.basis==="per_100ml"||rd.category==="beverages")?"ml":"g";
    const serv=rd.basis==="per_serving", sod=!isNum((rd.values||{}).salt_g)&&isNum((rd.values||{}).sodium_mg);
    $("per").textContent = isWater ? s.waterNote : s.per(unit, serv, sod);
    const flags=(d.flags||[]).map(f=>s.flagNames[f]).filter(Boolean);
    $("flagsline").textContent = flags.length ? s.flagsLine(flags.join(lang==="ar"?" و":" and ")) : (rd.category==="beverages"&&!isWater ? s.bevNoA : "");
    const kcal=kcalOf(v);
    const rows=[["energy_kJ",kcal,"kcal",isNum(v.energy_kJ)?`${v.energy_kJ} kJ`:""],["sugar_g",v.sugar_g,"غ"],["satfat_g",v.satfat_g,"غ"],["salt_g",saltOf(v),"غ"],["fibre_g",v.fibre_g,"غ"],["protein_g",v.protein_g,"غ"],["fat_g",v.fat_g,"غ"],["carb_g",v.carb_g,"غ"]];
    const u=x=>lang==="ar"?x:(x==="غ"?"g":x);
    $("values").innerHTML = rows.map(([k,val,un,sub])=>`<div><dt>${s.values[k]}</dt><dd>${isNum(val)?val:"–"}<small>${isNum(val)?u(un):""}</small>${sub?`<span class="kj" dir="ltr">${sub}</span>`:""}</dd></div>`).join("");
    renderMeaning(shownGrade||g.grade); renderReasons(g, isWater); renderWhatIf();
  }
  function renderMeaning(G){ const s=S[lang]; $("meaning").innerHTML=`${s.meaning[G]}<small>${s.meaningSub[G]}</small>`; }
  function renderReasons(g, isWater){
    const s=S[lang]; const settled=!result.hidden&&!busy;
    let items=[];
    if(isWater) items=[{k:"water",t:s.waterLine,pos:true}];
    else {
      items = engineReasons(g,3).map(k=>({k,t:s.reasons[k]||k,pos:false}));
      const p=g.points||{}; for(const k of ["fibre_g","protein_g","fvl_pct"]) if((p[k]||0)>=2 && items.length<3) items.push({k,t:s.pos[k],pos:true});
      if(items.length===0) items=[{k:"none",t:s.noReasons,pos:true}];
    }
    $("reasons").innerHTML = items.map(it=>`<li class="${settled?"in":""} ${it.pos?"pos":""}" style="--gcol:${COL[g.grade]}"><i></i>${it.t}</li>`).join("");
  }
  function whatIfInput(cut){
    const base=current.engine_input; const removed=base.sugar_g*(cut/100);
    const out={...base, sugar_g: round1(base.sugar_g-removed)};
    if(isNum(base.energy_kJ)) out.energy_kJ=Math.max(0, Math.round(base.energy_kJ-17*removed));   // sugar carries 17 kJ per gram
    return out;
  }
  function renderWhatIf(){
    const s=S[lang]; const cut=+$("cut").value;
    if(!rules || !current.engine_input || !isNum(current.engine_input.sugar_g) || current.engine_input.sugar_g===0){ $("whatif").style.display="none"; setHit(current.grade.grade, false); return; }
    $("whatif").style.display="";
    $("cutout").textContent=s.cut(cut);
    if(cut===0){ $("becomes").textContent=s.whatifIdle; setHit(current.grade.grade, current.grade.grade!==shownGrade); return; }
    const g2=computeGrade(rules, whatIfInput(cut)); const g=g2.ok?g2.grade:current.grade.grade;
    $("becomes").innerHTML=s.becomes(g, g===current.grade.grade); $("becomes").style.setProperty("--gcol",COL[g]);
    setHit(g, g!==shownGrade);
  }
  function setBadge(g, animate){
    const b=$("badge");
    if(look!=="scanner"||result.hidden||!g){ b.hidden=true; b.classList.remove("in"); return; }
    b.hidden=false; b.textContent=g; b.className="badge "+g; b.style.setProperty("--gcol",COL[g]); void b.offsetWidth; b.classList.add("in");
  }
  function setHit(g, animate){
    document.querySelectorAll("#band b").forEach(b=>{b.classList.toggle("hit",b.dataset.g===g); b.classList.toggle("dim",b.dataset.g!==g);});
    const L=$("letter");
    if(animate&&shownGrade){ L.classList.remove("swap"); void L.offsetWidth; L.classList.add("swap"); later(()=>{L.textContent=g; L.style.color=COL[g];},170); }
    else { L.textContent=g; L.style.color=COL[g]; }
    if(!result.hidden) setBadge(g, animate);
    shownGrade=g; renderMeaning(g);
  }
  let revealing=false;
  function finishReveal(){ // a tap completes every pending animation at once
    if(!revealing) return; clearTimers(); revealing=false;
    document.querySelectorAll("#band b").forEach(b=>b.classList.add("on"));
    const g=current.grade.grade; const L=$("letter"); L.classList.add("land"); setHit(g,false); if(look==="scanner") setBadge(g,true);
    ["meaning","values","whatif","foot","again"].forEach(id=>$(id).classList.add("in")); document.querySelectorAll("#reasons li").forEach(li=>li.classList.add("in"));
    busy=false; hint.textContent=S[lang].hint;
  }
  result.addEventListener("click", e=>{ if(revealing && !e.target.closest("input,button")) finishReveal(); });
  function showResult(fromConfirm=false){
    const g=current.grade; shownGrade=null; $("cut").value=0; busy=true; revealing=true;
    $("thumb").src=photoDataUrl||"";
    document.querySelectorAll("#band b").forEach(b=>b.classList.remove("on","hit","dim"));
    const L=$("letter"); L.classList.remove("land","swap"); L.textContent=g.grade; L.style.color=COL[g.grade];
    ["meaning","values","whatif","foot","again"].forEach(id=>$(id).classList.remove("in"));
    renderResultText(); document.querySelectorAll("#reasons li").forEach(li=>li.classList.remove("in"));
    const overlay=look==="scanner";
    if(!fromConfirm){ if(!overlay) scan.classList.add("leaving"); }
    later(()=>{
      if(!fromConfirm){ if(!overlay) scan.hidden=true; scan.classList.remove("leaving"); }
      else { confirm.hidden=true; if(!overlay) scan.hidden=true; }
      result.hidden=false; result.classList.add("entering"); result.scrollTop=0;
      requestAnimationFrame(()=>requestAnimationFrame(()=>result.classList.remove("entering")));
      const cells=[...document.querySelectorAll("#band b")];
      cells.forEach((b,i)=>later(()=>b.classList.add("on"), 350+i*130));
      later(()=>{ setHit(g.grade,false); L.classList.add("land"); if(overlay) setBadge(g.grade,true); }, 350+5*130+150);
      later(()=>$("meaning").classList.add("in"), 1450);
      later(()=>document.querySelectorAll("#reasons li").forEach((li,i)=>later(()=>li.classList.add("in"), i*140)), 1650);
      later(()=>$("values").classList.add("in"), 2150);
      later(()=>$("whatif").classList.add("in"), 2400);
      later(()=>{$("foot").classList.add("in"); $("again").classList.add("in"); busy=false; revealing=false; hint.textContent=S[lang].hint;}, 2650);
    }, fromConfirm?0:420);
  }
  function reset(){
    clearTimers(); busy=false; revealing=false; current=null; shownGrade=null; editing=false;
    result.classList.add("leaving");
    later(()=>{
      result.hidden=true; result.classList.remove("leaving"); confirm.hidden=true; $("badge").hidden=true; hideMsg();
      $("preview").classList.remove("show"); $("preview").src=""; $("placeholder").style.display=""; hint.textContent=S[lang].hint;
      if(scan.hidden){ scan.hidden=false; scan.classList.add("entering"); requestAnimationFrame(()=>requestAnimationFrame(()=>scan.classList.remove("entering"))); }
    },380);
  }
  $("again").addEventListener("click", reset);
  $("cut").addEventListener("input", renderWhatIf);

  applyStrings(); playIntro();
  window.addEventListener("error", e => { console.error(e.message); });
</script>
</body>
</html>
