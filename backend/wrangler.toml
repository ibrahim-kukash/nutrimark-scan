name = "nutrimark-backend"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# One KV namespace for rate limits, the daily cap, the result cache and the scan log.
# The id is filled in after `wrangler kv namespace create STORE` (needs the account login).
[[kv_namespaces]]
binding = "STORE"
id = "6aa57d6120f34d649a68d7720e5070ef"

[vars]
ALLOWED_ORIGINS = "https://ibrahim-kukash.github.io,http://127.0.0.1:8888,http://localhost:8888"
PRIMARY_MODEL = "claude-sonnet-5"
SECOND_PASS_MODEL = "claude-opus-5"
GEMINI_MODEL = "gemini-2.5-flash"
# Per network address. A stand's visitors share one address (its Wi-Fi), so these are the stand's limits.
PER_DEVICE_PER_MINUTE = "30"
PER_DEVICE_PER_DAY = "1500"
# Answers and corrections call no reader; a product can need two answers and a correction.
CORRECTIONS_PER_MINUTE = "90"
DAILY_SCAN_CAP = "5000"
KILL_SWITCH = "off"
READER_TIMEOUT_MS = "30000"
# The second, careful read (stronger model, high effort) gets longer than a first read.
SECOND_PASS_TIMEOUT_MS = "42000"
# The whole scan, from the moment the request arrives to the answer. The page gives up after 95 s, so the second read
# gets at most what is left of this.
SCAN_BUDGET_MS = "88000"
CACHE_TTL_SECONDS = "604800"
LOG_TTL_SECONDS = "2592000"

# Secrets (never in this file): ANTHROPIC_API_KEY, GOOGLE_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put GOOGLE_API_KEY
